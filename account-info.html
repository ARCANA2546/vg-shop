<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ข้อมูลบัญชี - VG SHOP</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>

    <body>

        <header class="site-header">
            <div class="container header-layout">
                <div class="logo-area">
                    <a href="index.html" class="brand-logo">VG SHOP</a>
                </div>
                <div class="right-actions">
                    <a href="index.html" style="color: #666;"><i class="fa-solid fa-house"></i> กลับหน้าหลัก</a>
                </div>
            </div>
        </header>

        <div class="container" style="margin-top: 50px; max-width: 550px;">
            <div class="login-card" style="text-align: center; padding: 40px;">
                <div id="user-avatar-container"
                    style="width: 110px; height: 110px; background: #000; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: #fff; border: 4px solid #eee; overflow: hidden;">
                    <i id="default-icon" class="fa-solid fa-user" style="font-size: 45px;"></i>
                    <img id="user-photo" src="" alt="Profile"
                        style="width: 100%; height: 100%; object-fit: cover; display: none;">
                </div>

                <h2 id="display-name" style="margin-bottom: 5px; font-weight: 600;">-</h2>
                <p id="display-email" style="color: #666; margin-bottom: 30px; font-size: 1.1rem;">-</p>

                <div
                    style="text-align: left; background: #f9f9f9; padding: 25px; border-radius: 12px; border: 1px solid #eee;">
                    <div
                        style="display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #ececec; padding-bottom: 10px;">
                        <span style="color: #777;">สถานะบัญชี : </span>
                        <span id="auth-status" style="font-weight: 500;">-</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: #777;">วันที่เข้าร่วม : </span>
                        <span id="join-date" style="font-weight: 500; color: #333;">-</span>
                    </div>
                </div>

                <button onclick="window.location.href='account-settings.html'" class="btn-login"
                    style="margin-top: 30px; background: #000;">
                    <i class="fa-solid fa-pen-to-square"></i> แก้ไขโปรไฟล์
                </button>
            </div>
        </div>

        <script type="module">
            document.addEventListener('DOMContentLoaded', () => {
                // 1. ดึงข้อมูลจาก localStorage ที่เราเก็บไว้ตอน Login (หน้า sign.html)
                const userData = JSON.parse(localStorage.getItem('currentUser'));

                if (userData) {
                    // --- แสดงชื่อผู้ใช้ (Username) ---
                    document.getElementById('user-name').innerText = userData.username || 'ไม่ระบุชื่อ';

                    // --- แสดงอีเมล (Email) ---
                    document.getElementById('user-email').innerText = userData.email || 'ไม่ระบุอีเมล';

                    // --- แสดงรูปโปรไฟล์ (ใช้ Avatar อัตโนมัติจากชื่อ) ---
                    const userPhoto = document.getElementById('user-photo');
                    const defaultIcon = document.getElementById('default-icon');

                    // ใช้ API สร้างรูปจากชื่อผู้ใช้
                    userPhoto.src = `https://ui-avatars.com/api/?name=${userData.username}&background=random&size=128`;
                    userPhoto.style.display = 'block';
                    defaultIcon.style.display = 'none';

                    // --- แสดงสถานะบัญชี ---
                    const statusEl = document.getElementById('auth-status');
                    // เนื่องจากเราใช้ตาราง User ปกติ เราจะตั้งเป็น "ยืนยันแล้ว" ให้เลย
                    statusEl.innerHTML = '<span style="color: green;"><i class="fa-solid fa-circle-check"></i> ยืนยันแล้ว (Standard)</span>';

                    // --- แสดงวันที่สมัคร ---
                    // Supabase มักจะมีคอลัมน์ created_at มาให้โดยอัตโนมัติ
                    const joinDate = userData.created_at;
                    if (joinDate) {
                        const date = new Date(joinDate);
                        const options = { year: 'numeric', month: 'long', day: 'numeric' };
                        document.getElementById('join-date').innerText = date.toLocaleDateString('th-TH', options);
                    } else {
                        document.getElementById('join-date').innerText = 'ไม่ระบุวันที่';
                    }

                } else {
                    // ถ้าไม่ได้ Login ให้เด้งไปหน้า Login
                    window.location.href = 'sign.html';
                }
            });
        </script>
    </body>
</html>
