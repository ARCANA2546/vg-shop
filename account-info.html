<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ข้อมูลบัญชี - VG SHOP</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>

    <body>

        <header class="site-header">
            <div class="container header-layout">
                <div class="logo-area">
                    <a href="index.html" class="brand-logo">VG SHOP</a>
                </div>
                <div class="right-actions">
                    <a href="index.html" style="color: #666;"><i class="fa-solid fa-house"></i> กลับหน้าหลัก</a>
                </div>
            </div>
        </header>

        <div class="container" style="margin-top: 50px; max-width: 550px;">
            <div class="login-card" style="text-align: center; padding: 40px;">
                <div id="user-avatar-container" style="width: 110px; height: 110px; border-radius: 50%; background: #f0f0f0; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 3px solid #eee;">
                    <i id="default-icon" class="fa-solid fa-user" style="font-size: 50px; color: #ccc;"></i>
                    <img id="user-photo" src="" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                </div>
                <h2 id="user-name" style="margin-bottom: 5px;">กำลังโหลด...</h2>
                <p id="user-email" style="color: #666; margin-bottom: 30px;">loading@example.com</p>

                <div style="text-align: left; background: #f9f9f9; padding: 20px; border-radius: 12px;">
                    <div style="margin-bottom: 15px; display: flex; justify-content: space-between;">
                        <span style="color: #888;">สถานะบัญชี</span>
                        <span id="auth-status" style="font-weight: 500;">ตรวจสอบ...</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: #888;">วันที่เข้าร่วม</span>
                        <span id="join-date" style="font-weight: 500;">-- -- ----</span>
                    </div>
                </div>
                <button onclick="window.location.href='index.html'" class="btn-signin" style="margin-top: 30px; width: 100%; background: #000;">ตกลง</button>
            </div>
        </div>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // ดึงข้อมูลจาก localStorage
                const userData = JSON.parse(localStorage.getItem('currentUser'));

                if (userData) {
                    // แสดงชื่อและอีเมล
                    document.getElementById('user-name').innerText = userData.username;
                    document.getElementById('user-email').innerText = userData.email;

                    // แสดงรูปโปรไฟล์
                    const userPhoto = document.getElementById('user-photo');
                    const defaultIcon = document.getElementById('default-icon');
                    userPhoto.src = `https://ui-avatars.com/api/?name=${userData.username}&background=random&size=128`;
                    userPhoto.style.display = 'block';
                    defaultIcon.style.display = 'none';

                    // แสดงสถานะ
                    document.getElementById('auth-status').innerHTML = '<span style="color: green;"><i class="fa-solid fa-circle-check"></i> ยืนยันแล้ว</span>';

                    // แสดงวันที่เข้าร่วม (ดึงจาก created_at ของ Supabase)
                    if (userData.created_at) {
                        const date = new Date(userData.created_at);
                        document.getElementById('join-date').innerText = date.toLocaleDateString('th-TH', { 
                            year: 'numeric', month: 'long', day: 'numeric' 
                        });
                    }
                } else {
                    // ถ้าไม่มีข้อมูล ให้กลับไปหน้า Login
                    window.location.href = 'sign.html';
                }
            });
        </script>
    </body>
</html>
