<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>เด็คทั้งหมด - VG SHOP</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>

        <header class="site-header">
            <div class="container header-layout">
                <div class="logo-area">
                    <a href="index.html" class="brand-logo">VG SHOP</a>
                </div>
                <nav class="center-nav">
                    <ul>
                        <li><a href="index.html">หน้าหลัก</a></li>
                        <li><a href="shop.html">ร้านค้า</a></li>
                        <li><a href="deck.html" class="active">เด็ค</a></li>
                    </ul>
                </nav>
                <div class="right-actions" id="userActionArea">
                    <a href="sign.html" class="btn-signin">เข้าสู่ระบบ</a>
                </div>
            </div>
        </header>

        <main class="container">
            <h1 class="page-title">รายการเด็คพร้อมเล่น</h1>
            
            <div class="deck-grid">
                <div class="deck-card">
                    <img src="image_09d5b8.jpg" alt="Lyrical Monasterio Deck" class="deck-image">
                    <div class="deck-info">
                        <div class="deck-title">Lyrical Monasterio Deck (Full Set)</div>
                        <div class="deck-price">฿2,500</div>
                        <button class="btn-signin" style="width: 100%; background: #000;">ดูรายการการ์ด</button>
                    </div>
                </div>

                <div class="deck-card">
                    <img src="image_09d5b1.jpg" alt="Stoicheia Deck" class="deck-image">
                    <div class="deck-info">
                        <div class="deck-title">Stoicheia Deck (Sylvan Horned Beast)</div>
                        <div class="deck-price">฿1,800</div>
                        <button class="btn-signin" style="width: 100%; background: #000;">ดูรายการการ์ด</button>
                    </div>
                </div>
            </div>
        </main>

        <footer class="site-footer" style="margin-top: 100px;">
            <div class="container footer-layout">
                <div class="footer-left">
                    <h2>VG SHOP</h2>
                    <p>The best card shop in town.</p>
                </div>
                <div class="footer-right">
                    <p>&copy; 2026 VG SHOP. สงวนลิขสิทธิ์.</p>
                </div>
            </div>
        </footer>

    </body>
</html>
