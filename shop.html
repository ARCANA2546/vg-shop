<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ร้านค้า - VG SHOP</title>
        <link rel="stylesheet" href="styles.css">
        <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </head>
    <body>

        <header class="site-header">
            <div class="container header-layout">
                <div class="logo-area">
                    <a href="homepage.html" class="brand-logo">VG SHOP</a>
                </div>
                <nav class="center-nav">
                    <ul>
                        <li><a href="homepage.html">หน้าหลัก</a></li>
                        <li><a href="shop.html" class="active">ร้านค้า</a></li>
                        <li><a href="#">การ์ด</a></li>
                        <li><a href="#">เด็ค</a></li>
                    </ul>
                </nav>
                <div class="right-actions" id="userActionArea">
                    <a href="sign.html" class="btn-signin">เข้าสู่ระบบ</a>
                </div>
            </div>
        </header>

        <main class="container">
            <div class="shop-container">
                
                <aside class="sidebar">
                    <div class="filter-group">
                        <span class="filter-title">ค้นหาสินค้า</span>
                        <div class="search-box">
                            <input type="text" id="shopSearch" placeholder="พิมพ์ชื่อสินค้า...">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                    </div>

                    <div class="filter-group">
                        <span class="filter-title">หมวดหมู่</span>
                        <ul class="category-list">
                            <li>
                                <label>
                                    <input type="checkbox" name="category" value="starter"> Starter Deck
                                </label>
                            </li>
                            <li>
                                <label>
                                    <input type="checkbox" name="category" value="booster"> Booster Pack
                                </label>
                            </li>
                            <li>
                                <label>
                                    <input type="checkbox" name="category" value="character"> Character Deck
                                </label>
                            </li>
                        </ul>
                    </div>
                </aside>

                <section class="shop-content">
                    <div class="shop-results-header">
                        <p id="itemCount">กำลังแสดงสินค้าทั้งหมด</p>
                    </div>

                    <div class="product-grid" id="productGrid">
                        <div class="card product-card product-item" data-category="starter" data-name="Sylvan King">
                            <img src="img/MOCK_VGD_SD04.png" alt="Sylvan King" onerror="this.src='https://via.placeholder.com/300x250?text=Starter+Deck'">
                            <div class="card-body">
                                <h4>Start Deck 04: Sylvan King</h4>
                                <p class="price">฿99</p>
                                <button class="btn-outline">ดูรายละเอียด</button>
                            </div>
                        </div>

                        <div class="card product-card product-item" data-category="booster" data-name="Minerva Rising">
                            <img src="img/MOCK_VGD_CP08_BOX-2048x1478.png" alt="Minerva Rising" onerror="this.src='https://via.placeholder.com/300x250?text=Booster+Pack'">
                            <div class="card-body">
                                <h4>Minerva Rising (D-CP08)</h4>
                                <p class="price">฿900</p>
                                <button class="btn-outline">ดูรายละเอียด</button>
                            </div>
                        </div>

                        <div class="card product-card product-item" data-category="character" data-name="Aichi Sendou Deck">
                            <img src="img/images.jpg" alt="Character Deck">
                            <div class="card-body">
                                <h4>Character Deck: Aichi Sendou</h4>
                                <p class="price">฿69</p>
                                <button class="btn-outline">ดูรายละเอียด</button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer class="site-footer">
            <div class="container footer-layout">
                <div class="footer-left">
                    <h2>VG SHOP</h2>
                    <p>The best card shop in town.</p>
                </div>
                <div class="footer-right">
                    <p>&copy; 2026 VG SHOP. สงวนลิขสิทธิ์.</p>
                </div>
            </div>
        </footer>

        <script type="module">
            /* --- Firebase Auth Logic --- */
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
            import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

            const firebaseConfig = {
                apiKey: "AIzaSyAV3snK_1l53ZX1ITml_crwAJSrJP_3BIU",
                authDomain: "vg-shop-c7056.firebaseapp.com",
                projectId: "vg-shop-c7056",
                storageBucket: "vg-shop-c7056.firebasestorage.app",
                messagingSenderId: "630247091832",
                appId: "1:630247091832:web:d885fe3dfc610501fc478d"
            };

            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const actionArea = document.getElementById('userActionArea');

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    const userName = user.displayName || user.email.split('@')[0];
                    actionArea.innerHTML = `<div class="user-name" style="font-weight:500;">${userName}</div>`;
                }
            });

            /* --- Shop Filtering Logic --- */
            const searchInput = document.getElementById('shopSearch');
            const checkboxes = document.querySelectorAll('input[name="category"]');
            const products = document.querySelectorAll('.product-item');
            const itemCountText = document.getElementById('itemCount');

            function filterProducts() {
                const searchText = searchInput.value.toLowerCase();
                const selectedCategories = Array.from(checkboxes)
                    .filter(cb => cb.checked)
                    .map(cb => cb.value);

                let visibleCount = 0;

                products.forEach(product => {
                    const productName = product.getAttribute('data-name').toLowerCase();
                    const productCat = product.getAttribute('data-category');
                    
                    const matchesSearch = productName.includes(searchText);
                    const matchesCategory = selectedCategories.length === 0 || selectedCategories.includes(productCat);

                    if (matchesSearch && matchesCategory) {
                        product.style.display = 'block';
                        visibleCount++;
                    } else {
                        product.style.display = 'none';
                    }
                });

                itemCountText.innerText = `พบสินค้าทั้งหมด ${visibleCount} รายการ`;
            }

            searchInput.addEventListener('input', filterProducts);
            checkboxes.forEach(cb => cb.addEventListener('change', filterProducts));
            
            // เรียกใช้ครั้งแรกเพื่อให้นับจำนวนสินค้าตั้งต้น
            filterProducts();
        </script>
    </body>

</html>
