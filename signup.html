<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>สมัครสมาชิก - VG SHOP</title>
        <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        <script type="text/javascript">
            (function(){
                emailjs.init("ec8yJSGmW3AwGLnR4"); // ใส่ Public Key ของคุณตรงนี้
            })();
        </script>
    </head>
    <body>

        <header class="site-header">
            <div class="container">
                <div class="header-layout">
                    <div class="logo-area">
                        <a href="index.html" class="brand-logo">VG SHOP</a>
                    </div>
                    <nav class="center-nav">
                        <ul>
                            <li><a href="index.html">หน้าหลัก</a></li>
                            <li><a href="shop.html">ร้านค้า</a></li>
                            <li><a href="deck.html">เด็ค</a></li>
                        </ul>
                    </nav>
                    <div class="right-actions"></div>
                </div>
            </div>
        </header>

        <section class="login-section">
            <div class="login-card" style="max-width: 500px;">
                <h2>สมัครสมาชิก</h2>
                <p class="sub-text">สร้างบัญชีเพื่อเริ่มต้นใช้งาน</p>
                
                <form id="signupForm" onsubmit="handleSignup(event)">
                    
                    <div class="form-group">
                        <label for="username">ชื่อผู้ใช้ (Username) <span style="color:red">*</span></label>
                        <input type="text" id="username" class="form-input" placeholder="ตั้งชื่อผู้ใช้ของคุณ" required>
                    </div>

                    <div class="form-group">
                        <label for="email">อีเมล <span style="color:red">*</span></label>
                        <div style="display: flex; gap: 10px;">
                            <input type="email" id="email" class="form-input" placeholder="example@email.com" required>
                            <button type="button" id="btnSendCode" onclick="sendOTP()" class="btn-outline" style="white-space: nowrap; padding: 0 20px; font-size: 14px;">ส่งรหัส</button>
                        </div>
                        <small id="emailHelp" style="color: #666; font-size: 12px; display: none;">รหัสถูกส่งไปยังอีเมลแล้ว</small>
                    </div>

                    <div class="form-group">
                        <label for="verifyCode">รหัสยืนยัน (จากอีเมล) <span style="color:red">*</span></label>
                        <input type="text" id="otp" class="form-input" placeholder="กรอกรหัส 6 หลัก" maxlength="6" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">รหัสผ่าน <span style="color:red">*</span></label>
                        <input type="password" id="password" class="form-input" placeholder="กำหนดรหัสผ่าน" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">ยืนยันรหัสผ่าน <span style="color:red">*</span></label>
                        <input type="password" id="confirmPassword" class="form-input" placeholder="กรอกรหัสผ่านอีกครั้ง" required>
                    </div>

                    <button type="submit" class="btn-login" style="margin-top: 20px;">ยืนยันการสมัคร</button>
                </form>

                <div class="divider">
                    <span>มีบัญชีอยู่แล้ว?</span>
                </div>

                <a href="sign.html" style="text-decoration: none;">
                    <button type="button" class="btn-register">เข้าสู่ระบบ</button>
                </a>
            </div>
        </section>

        <footer class="site-footer">
            <div class="container">
                <div class="footer-layout">
                    <div class="footer-left">
                        <h2>VG SHOP</h2>
                        <p>ศูนย์รวมการ์ดเกมที่ครบวงจรที่สุด</p>
                    </div>
                    <div class="footer-right">
                        <p>&copy; 2024 VG Shop. All rights reserved.</p>
                    </div>
                </div>
            </div>
        </footer>

        <div id="successModal" class="modal-overlay">
            <div class="modal-box">
                <div class="success-checkmark">
                    <div class="check-icon">
                        <span class="icon-line line-tip"></span>
                        <span class="icon-line line-long"></span>
                        <div class="icon-circle"></div>
                        <div class="icon-fix"></div>
                    </div>
                </div>
                <h3>สมัครสมาชิกเรียบร้อย!</h3>
                <p>ระบบจะพาคุณไปหน้าเข้าสู่ระบบใน <span id="timer" style="font-weight:bold; color:#000;">3</span> วินาที...</p>
                <button class="btn-login" onclick="closeModal()" style="margin-top: 20px; width: auto; padding-left: 30px; padding-right: 30px;">ไปหน้าเข้าสู่ระบบทันที</button>
            </div>
        </div>

        <script type="module">
            import { supabase } from './supabase-config.js'

            // ตั้งค่า EmailJS (ใส่ Public Key ของคุณ)
            emailjs.init("ec8yJSGmW3AwGLnR4");

            let generatedOTP = "";

            // 1. ฟังก์ชันส่ง OTP (ผูกกับปุ่ม "ส่งรหัส")
            window.sendOTP = function() {
                const email = document.getElementById('email').value;
                const btn = document.getElementById('btnSendCode');

                if (!email) {
                    alert("กรุณากรอกอีเมลก่อนครับ");
                    return;
                }

                // สุ่มรหัส 6 หลัก
                generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

                btn.disabled = true;
                btn.innerText = "กำลังส่ง...";

                // ส่งผ่าน EmailJS
                // ** อย่าลืมเปลี่ยน YOUR_SERVICE_ID และ YOUR_TEMPLATE_ID **
                emailjs.send("service_v7ku20q", "template_bqbbmxo", {
                    user_email: email,
                    otp_code: generatedOTP,
                })
                .then(() => {
                    alert("ส่งรหัสยืนยันไปยังอีเมล " + email + " เรียบร้อยแล้ว!");
                    document.getElementById('emailHelp').style.display = 'block';
                    btn.innerText = "ส่งอีกครั้ง";
                    btn.disabled = false;
                })
                .catch((err) => {
                    alert("เกิดข้อผิดพลาดในการส่งเมล์: " + JSON.stringify(err));
                    btn.disabled = false;
                    btn.innerText = "ส่งรหัส";
                });
            }

            // 2. ฟังก์ชันจัดการการสมัครสมาชิก (ผูกกับ Form onsubmit)
            window.handleSignup = async function(event) {
                event.preventDefault();

                const username = document.getElementById('username').value;
                const email = document.getElementById('email').value;
                const otpInput = document.getElementById('otp').value;
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // ตรวจสอบความถูกต้องเบื้องต้น
                if (otpInput !== generatedOTP || generatedOTP === "") {
                    alert("รหัสยืนยัน (OTP) ไม่ถูกต้อง!");
                    return;
                }

                if (password !== confirmPassword) {
                    alert("รหัสผ่านไม่ตรงกัน!");
                    return;
                }

                // แสดงสถานะกำลังโหลด
                const submitBtn = event.target.querySelector('button[type="submit"]');
                submitBtn.innerText = "กำลังบันทึกข้อมูล...";
                submitBtn.disabled = true;

                // บันทึกลงตาราง User ใน Supabase
                const { data, error } = await supabase
                    .from('User')
                    .insert([
                        { 
                            username: username, 
                            email: email, 
                            password: password // หมายเหตุ: ในระบบจริงควรใช้การ Hash รหัสผ่าน
                        }
                    ]);

                if (error) {
                    alert('สมัครสมาชิกไม่สำเร็จ: ' + error.message);
                    submitBtn.innerText = "ยืนยันการสมัคร";
                    submitBtn.disabled = false;
                } else {
                    // เรียกใช้ Modal สำเร็จที่คุณทำไว้
                    showSuccessModal();
                }
            }

            // ฟังก์ชันจัดการ Modal
            function showSuccessModal() {
                const modal = document.getElementById('successModal');
                modal.style.display = 'flex';
                
                let timeLeft = 3;
                const timerElement = document.getElementById('timer');
                
                const countdown = setInterval(() => {
                    timeLeft--;
                    timerElement.innerText = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        window.location.href = 'sign.html';
                    }
                }, 1000);
            }

            window.closeModal = function() {
                window.location.href = 'sign.html';
            }
        </script>
    </body>
</html>
