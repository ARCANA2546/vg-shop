<!DOCTYPE html>
<html lang="th">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>เข้าสู่ระบบ - VG SHOP</title>
        <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>

        <header class="site-header">
            <div class="container">
                <div class="header-layout">
                    <div class="logo-area">
                        <a href="index.html" class="brand-logo">VG SHOP</a>
                    </div>
                    <nav class="center-nav">
                        <ul>
                            <li><a href="index.html">หน้าหลัก</a></li>
                            <li><a href="shop.html">ร้านค้า</a></li>
                            <li><a href="deck.html">เด็ค</a></li>
                        </ul>
                    </nav>
                    <div class="right-actions">
                    </div>
                </div>
            </div>
        </header>

        <section class="login-section">
            <div class="login-card">
                <h2>ยินดีต้อนรับ</h2>
                <p class="sub-text">กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</p>
                
                <form action="homepage.html">
                    <div class="form-group">
                        <label for="loginInput">อีเมล หรือ ชื่อผู้ใช้</label>
                        <input type="text" id="loginInput" class="form-input" placeholder="กรอกอีเมล หรือ ชื่อผู้ใช้" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">รหัสผ่าน</label>
                        <input type="password" id="password" class="form-input" placeholder="กรอกรหัสผ่าน" required>
                    </div>

                    <div class="forgot-pass">
                        <a href="forgot-password.html">ลืมรหัสผ่าน?</a>
                    </div>

                    <button type="submit" class="btn-login">เข้าสู่ระบบ</button>
                </form>

                <div class="divider">
                    <span>ยังไม่มีบัญชีสมาชิก?</span>
                </div>

                <a href="signup.html" style="text-decoration: none;">
                    <button type="button" class="btn-register">สมัครสมาชิก</button>
                </a>
            </div>
        </section>

        <footer class="site-footer">
            <div class="container">
                <div class="footer-layout">
                    <div class="footer-left">
                        <h2>VG SHOP</h2>
                        <p>ศูนย์รวมการ์ดเกมที่ครบวงจรที่สุด</p>
                    </div>
                    <div class="footer-right">
                        <p>&copy; 2024 VG Shop. All rights reserved.</p>
                    </div>
                </div>
            </div>
        </footer>

        <script type="module">
            import { supabase } from './supabase-config.js'
            const loginForm = document.querySelector('form');
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                // identifier คือค่าที่ผู้ใช้กรอก (จะเป็นเมลหรือ username ก็ได้)
                const identifier = document.getElementById('loginInput').value; 
                const password = document.getElementById('password').value;

                // ค้นหา User โดยเช็คว่า identifier ตรงกับ email "หรือ" username
                const { data, error } = await supabase
                    .from('User')
                    .select('*')
                    .or(`email.eq.${identifier},username.eq.${identifier}`) 
                    .eq('password', password)
                    .single();

                if (data) {
                    alert('เข้าสู่ระบบสำเร็จ!');
                    localStorage.setItem('currentUser', JSON.stringify(data));
                    window.location.href = 'index.html';
                } else {
                    // ถ้าหาไม่เจอ หรือรหัสไม่ตรง
                    alert('อีเมล หรือ ชื่อผู้ใช้ หรือ รหัสผ่านไม่ถูกต้อง');
                }
            });
        </script>
    </body>
</html>
